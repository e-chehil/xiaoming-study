schema:
  schema_id: xiaoming
  name: 潇明
  version: "2.0-upstream.1"
  dependencies: [rime_ice]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
engine:
  processors: [ascii_composer, recognizer, key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, reverse_lookup_translator, table_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxy_
  initials: abcdefghijklmnopqrstuvwxy
  delimiter: " "
  auto_select: true
translator:
  dictionary: xiaoming
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
reverse_lookup:
  dictionary: rime_ice
  prism: rime_ice
  prefix: z
  tips: 〔拼音反查〕
recognizer:
  patterns:
    reverse_lookup: "^z[a-z]*$"
menu:
  page_size: 5
punctuator:
  import_preset: default
key_binder:
  bindings:
    - {when: has_menu, accept: semicolon, send: 2}
    - {when: has_menu, accept: apostrophe, send: 3}
    - {when: has_menu, accept: space, send: 1}
    - {when: composing, accept: space, send: underscore}
    - {when: paging, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
