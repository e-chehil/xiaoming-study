[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/sw.mjs"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/offline-shell.mjs"
  [headers.values]
    Cache-Control = "no-cache"
